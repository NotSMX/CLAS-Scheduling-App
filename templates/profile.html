{% extends "base.html" %}

{% block title %}CLAS Schedule{% endblock %}

{% block content %}

  <main class="shell">
    <h2 class="section-title">Your Profile</h2>
    <div class="profile-card card">
      <img class="avatar" src="{{ user.profile_pic_url or 'https://ui-avatars.com/api/?name=' ~ (user.name|replace(' ', '+')) }}" alt="avatar" />
      <div class="profile-info">
        <h3>{{ user.name }}</h3>
        <p>{{ user.email }}</p>
        <span class="pill">{{ user.role|title }}</span>
        <div class="profile-actions">
          <a class="btn" href="{{ url_for('main.settings_page') }}">Edit Profile</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
{% endblock %}
