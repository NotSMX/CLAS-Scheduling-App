{% extends "base.html" %}

{% block title %}CLAS Schedule{% endblock %}

{% block content %}
  <div class="event-create-container">
    <h2>Create Event Details</h2>
    {% if success_code %}
      <div class="alert alert-success">{{ success_message }}</div>
    {% endif %}

    {% if error_code %}
      <div class="alert alert-error">{{ error_message }}</div>
    {% endif %}

    {% if info_code %}
      <div class="alert alert-info">{{ info_message }}</div>
    {% endif %}
    <form action="{{ url_for('events.api_create_event') }}" method="post">
      <input type="hidden" name="user_id" value="{{ current_user.id }}">
      
      <label for="clas_type">CLAS Type</label>
      <select name="clas_type">
        <option value="Thursday CLAS">Thursday CLAS</option>
        <option value="Open CLAS">Open CLAS</option>
      </select>
      
      <label for="format">Format</label>
      <select name="format">
        <option value="Poster">Poster</option>
        <option value="Presentation">Presentation</option>
        <option value="Wildcard">Wildcard</option>
      </select>
      
      <label for="department">Department</label>
      <input
        type="text"
        name="department"
        placeholder="e.g. CS, BIO, MATH"
      >

      <label for="course_number">Course Number</label>
      <input
        type="text"
        name="course_number"
        placeholder="e.g. 101, 240, 350"
      >

      <label for="course_title">Course Title</label>
      <input
        type="text"
        name="course_title"
        placeholder="e.g. Introduction to Computer Science"
      >

      <label for="num_entries">Number of Entries</label>
      <input
        type="number"
        name="num_entries"
        placeholder="e.g. 5"
      >

      <label for="num_students">Number of Students</label>
      <input
        type="number"
        name="num_students"
        placeholder="e.g. 20"

      >

      <label for="session_title">Session Title</label>
      <input
        type="text"
        name="session_title"
        placeholder="e.g. Capstone Project Showcase"
      >

      <label for="session_length">Session Length (in minutes)</label>
      <input
        type="number"
        name="session_length"
        placeholder="e.g. 60"
      >

      <label for="individual_entry_length">Individual Entry Length (in minutes)</label>
      <input
        type="number"
        name="individual_entry_length"
        placeholder="e.g. 10"
      >

      <label for="room_request">Room Request</label>
      <input
        type="text"
        name="room_request"
        placeholder="e.g. Lovejoy 201"
      >

      <label for="special_request">Special Requests</label>
      <input
        type="text"
        name="special_request"
        placeholder="e.g. Projector, microphone, wheelchair access"
      >
      
      <button class="btn" type="submit" name="action" value="draft">Save Draft</button>
      <button class="btn-outline" type="submit" name="action" value="submit">Submit Event</button>

    </form>
  </div>
</body>
</html>
{% endblock %}
